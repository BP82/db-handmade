
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>DB Handmade | Link ufficiali</title>
  <meta name="description"
        content="Scopri DB Handmade e tutti i nostri contatti ufficiali.">

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background: #f7f4ed;
      color: #193e30;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    main {
      max-width: 480px;
      margin: 0 auto;
      padding: 65px 24px 40px;
    }

    .brand-logo {
      display: block;
      width: 240px;
      max-width: 85%;
      height: auto;
      margin: 0 auto 30px;
    }

    .subtitle {
      font-size: 12px;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    p {
      line-height: 1.7;
      color: #657268;
    }

    .links {
      display: grid;
      gap: 14px;
      margin-top: 38px;
    }

    .link-button {
      display: block;
      padding: 18px;
      border: 1px solid #193e30;
      border-radius: 18px;
      text-decoration: none;
      color: #193e30;
      font-weight: 600;
      transition: background-color 0.2s ease,
                  color 0.2s ease;
    }

    .link-button.pending {
      opacity: 0.5;
      cursor: default;
    }

    .email-button {
      background-color: #193e30;
      color: #ffffff;
    }

    .email-button:hover {
      background-color: #285440;
    }

    .link-button:focus-visible {
      outline: 2px solid #193e30;
      outline-offset: 4px;
    }

    footer {
      margin-top: 60px;
      font-size: 12px;
      color: #657268;
    }

    @media (max-width: 600px) {
      main {
        padding: 36px 20px 40px;
      }

      .brand-logo {
        width: 210px;
        max-width: 80%;
      }

      .link-button {
        padding: 16px;
      }
    }
  </style>
</head>

<body>
  <main>
    <img src="logo.png"
         alt="DB Handmade"
         class="brand-logo">

    <div class="subtitle">
      Creazioni artigianali
    </div>

    <p>Ogni creazione racconta una storia.</p>

    <div class="links">
      <span class="link-button pending">
        Instagram — Prossimamente
      </span>

      <span class="link-button pending">
        WhatsApp — Prossimamente
      </span>

      <span class="link-button pending">
        Facebook — Prossimamente
      </span>

      <span class="link-button pending">
        Sito web — Prossimamente
      </span>

      <a href="mailto:Donny.78@icloud.com"
         class="link-button email-button">
        ✉ Email
      </a>
    </div>

    <footer>© DB Handmade</footer>
  </main>
</body>
</html>
