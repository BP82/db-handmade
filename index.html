<style>

body{margin:0;background:#f7f4ed;color:#193e30;font-family:Arial,sans-serif;text-align:center}
main{max-width:480px;margin:auto;padding:65px 24px}
.brand{font-family:Georgia,serif;font-size:38px;letter-spacing:2px;margin-bottom:8px}
.subtitle{font-size:12px;letter-spacing:4px;text-transform:uppercase}
p{line-height:1.7;color:#657268}
.links{display:grid;gap:14px;margin-top:38px}
a{display:block;padding:18px;border:1px solid #193e30;border-radius:3px;text-decoration:none;color:#193e30;font-weight:600}
a:hover{background:#193e30;color:white}
footer{margin-top:60px;font-size:12px;color:#657268}
.brand-logo {

  height: auto;
  margin: 0 auto 25px;
}
  /* DB Handmade - Ottimizzazione mobile */

* {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  padding: 36px 20px 48px;
}

.brand-logo {
  display: block;
  width: 240px;
  max-width: 80%;
  height: auto;
  margin: 0 auto 30px;
}

a {
  transition: background-color 0.2s ease,
              color 0.2s ease,
              transform 0.2s ease;
}

a:focus-visible {
  outline: 2px solid #234B3A;
  outline-offset: 4px;
}

@media (max-width: 600px) {
  body {
    padding: 28px 20px 40px;
  }

  .brand-logo {
    width: 210px;
    max-width: 78%;
    margin-bottom: 28px;
  }
}
  /* Pulsante Email verde bosco */
.email-button {
  display: block;
  background-color: #234B3A;
  color: #FFFFFF !important;
  border: 1px solid #234B3A;
  border-radius: 8px;
  text-align: center;
  padding: 15px 20px;
  text-decoration: none;
  font-weight: 600;
}
</style>
</head>

     class="brand-logo">
